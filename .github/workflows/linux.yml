name: Сборка для Linux

# The Linux program can only be built on Linux: build.sh on Ubuntu 22.04 (glibc 2.35, so it runs on
# Ubuntu 22.04+, Debian 12+, Fedora 36+ and others as new). Every push keeps the archive as an
# artifact; a published release gets it as AirMouse-linux-x64.tar.gz next to the Windows zip.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Библиотеки для сборки и проверки
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libgles2
      - name: Сборка
        run: PYTHON=python ./build.sh
      - name: Собранная программа загружает модели
        run: dist/AirMouse/AirMouse --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: AirMouse-linux-x64
          path: dist/AirMouse-linux-x64.tar.gz
      - name: В релиз
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/AirMouse-linux-x64.tar.gz --clobber
