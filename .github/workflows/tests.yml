name: Тесты

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Библиотеки Linux для MediaPipe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libgles2
      - name: Зависимости
        run: python -m pip install --no-deps -r requirements.txt
      - name: Автотесты
        run: python -m unittest -v
      - name: Модели загружаются
        run: python main.py --selftest
